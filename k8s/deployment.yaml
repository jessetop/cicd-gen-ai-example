apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chat-demo
  labels:
    app: ai-chat-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-chat-demo
  template:
    metadata:
      labels:
        app: ai-chat-demo
    spec:
      containers:
      - name: ai-chat-demo
        image: IMAGE_URI
        ports:
        - containerPort: 5000
        env:
        - name: HUGGING_FACE_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-chat-secrets
              key: hugging-face-token
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5